<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f0e8; min-height: 100vh; color: #2c2c2a; }

  .wrap { max-width: 420px; margin: 0 auto; padding: 1rem; }

  .card { background: #fff; border: 1px solid #e0ddd5; border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; }

  /* stats */
  .section-label { font-size: 11px; color: #888780; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; font-weight: 500; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box { background: #f5f0e8; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .stat-label { font-size: 12px; color: #888780; margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: center; align-items: baseline; gap: 5px; }
  .stat-scanned { font-size: 22px; font-weight: 600; color: #1D9E75; line-height: 1; }
  .stat-remaining { font-size: 14px; font-weight: 500; color: #888780; }
  .stat-divider { font-size: 13px; color: #bbb; }
  .stat-legend { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 11px; color: #888780; }
  .stat-legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-in  { background: #1D9E75; }
  .dot-out { background: #d3d1c7; }
  #stats-error { font-size: 12px; color: #E24B4A; text-align: center; margin-top: 10px; display: none; }

  /* scan button */
  #btn-scan { width: 100%; padding: 18px; background: #085041; color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; margin-bottom: 1rem; }
  #btn-scan:active { background: #04342C; }

  /* camera */
  #reader-wrap { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #e0ddd5; margin-bottom: 1rem; display: none; }
  #reader { width: 100% !important; }
  #btn-cancel { width: 100%; padding: 13px; background: transparent; border: 1px solid #d3d1c7; border-radius: 12px; font-size: 15px; color: #5f5e5a; cursor: pointer; margin-bottom: 1rem; display: none; }

  /* result */
  #result-card { display: none; border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid transparent; }
  #result-card.valid     { background: #E1F5EE; border-color: #9FE1CB; }
  #result-card.duplicate { background: #FFF8E1; border-color: #FFE082; }
  #result-card.invalid   { background: #FCEBEB; border-color: #F7C1C1; }
  #res-status { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .valid   #res-status { color: #0F6E56; }
  .duplicate #res-status { color: #92400E; }
  .invalid   #res-status { color: #A32D2D; }
  #res-name { font-size: 22px; font-weight: 600; color: #2c2c2a; margin-bottom: 14px; }
  .field-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid rgba(0,0,0,0.06); font-size: 14px; }
  .field-key { color: #888780; }
  .field-val { font-weight: 500; color: #2c2c2a; }
  #scanned-at-row { display: none; }

  /* again */
  #btn-again { width: 100%; padding: 13px; background: transparent; border: 1px solid #d3d1c7; border-radius: 12px; font-size: 15px; color: #2c2c2a; cursor: pointer; margin-bottom: 1rem; display: none; }

  /* log */
  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f1efe8; font-size: 13px; }
  .log-item:last-child { border-bottom: none; }
  .log-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; display: inline-block; }
  .log-dot.ok  { background: #1D9E75; }
  .log-dot.dup { background: #F59E0B; }
  .log-dot.err { background: #E24B4A; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Stats -->
  <div class="card">
    <div class="section-label">Check-in progress <span style="float:right;cursor:pointer;font-size:13px" onclick="loadStats()">↻ Refresh</span></div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">Adults (12+)</div>
        <div class="stat-row">
          <span class="stat-scanned" id="stat-adults-scanned">—</span>
          <span class="stat-divider">/</span>
          <span class="stat-remaining" id="stat-adults-remaining">—</span>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Kids (5–12)</div>
        <div class="stat-row">
          <span class="stat-scanned" id="stat-kids-scanned">—</span>
          <span class="stat-divider">/</span>
          <span class="stat-remaining" id="stat-kids-remaining">—</span>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Under 5</div>
        <div class="stat-row">
          <span class="stat-scanned" id="stat-children-scanned">—</span>
          <span class="stat-divider">/</span>
          <span class="stat-remaining" id="stat-children-remaining">—</span>
        </div>
      </div>
    </div>
    <div class="stat-legend">
      <span><span class="dot dot-in"></span> Scanned</span>
      <span><span class="dot dot-out"></span> Remaining</span>
    </div>
    <div id="stats-error">Could not load stats — check connection</div>
  </div>

  <!-- Scan button -->
  <button id="btn-scan" onclick="startScan()">📷 &nbsp; Scan QR Code</button>

  <!-- Camera -->
  <div id="reader-wrap"><div id="reader"></div></div>
  <button id="btn-cancel" onclick="cancelScan()">Cancel</button>

  <!-- Result -->
  <div id="result-card">
    <div id="res-status"></div>
    <div id="res-name"></div>
    <div class="field-row"><span class="field-key">Category</span><span class="field-val" id="res-cat"></span></div>
    <div class="field-row"><span class="field-key">RSVP ID</span><span class="field-val" id="res-id" style="font-family:monospace;font-size:12px"></span></div>
    <div class="field-row" id="scanned-at-row"><span class="field-key">First scanned</span><span class="field-val" id="res-scanned-at" style="color:#F59E0B"></span></div>
  </div>

  <button id="btn-again" onclick="reset()">← Scan next guest</button>

  <!-- Log -->
  <div class="section-label">Recent scans</div>
  <div class="card" style="padding: 0 1.25rem;" id="log-card">
    <div id="log-list"><div class="log-item" style="color:#888780">No scans yet</div></div>
  </div>

</div>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2CdTB4EFNmwF_Ns6k85Qpwdc1q9SakhELWvD5GP-if2Q5uPjYKo0xE6m4T7wCQKCL/exec";

let scanner = null;
let log = [];

window.addEventListener("load", loadStats);

async function loadStats() {
  try {
    const res  = await fetch(WEB_APP_URL + "?action=stats");
    const data = await res.json();

    const set = (id, val) => { document.getElementById(id).textContent = val; };

    set("stat-adults-scanned",    data.adults.scanned);
    set("stat-adults-remaining",  data.adults.total - data.adults.scanned + " left");
    set("stat-kids-scanned",      data.kids.scanned);
    set("stat-kids-remaining",    data.kids.total - data.kids.scanned + " left");
    set("stat-children-scanned",  data.children.scanned);
    set("stat-children-remaining",data.children.total - data.children.scanned + " left");

    document.getElementById("stats-error").style.display = "none";
  } catch(e) {
    document.getElementById("stats-error").style.display = "block";
  }
}

function startScan() {
  document.getElementById("btn-scan").style.display    = "none";
  document.getElementById("reader-wrap").style.display = "block";
  document.getElementById("btn-cancel").style.display  = "block";
  document.getElementById("result-card").style.display = "none";
  document.getElementById("btn-again").style.display   = "none";

  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess,
    () => {}
  ).catch(err => { alert("Camera error: " + err); reset(); });
}

function onScanSuccess(raw) {
  scanner.stop().then(() => {
    scanner = null;
    document.getElementById("reader-wrap").style.display = "none";
    document.getElementById("btn-cancel").style.display  = "none";
    processQR(raw);
  });
}

function cancelScan() {
  if (scanner) { scanner.stop().catch(() => {}); scanner = null; }
  reset();
}

function parseQR(raw) {
  const obj = {};
  raw.split("|").forEach(part => {
    const i = part.indexOf(":");
    if (i > -1) obj[part.substring(0, i)] = part.substring(i + 1);
  });
  return obj;
}

async function processQR(raw) {
  const d = parseQR(raw);

  document.getElementById("result-card").style.display = "block";
  document.getElementById("btn-again").style.display   = "block";
  document.getElementById("res-id").textContent        = d.ID  || "—";
  document.getElementById("res-cat").textContent       = d.CAT || "—";
  document.getElementById("scanned-at-row").style.display = "none";

  if (!d.ID) {
    showResult("invalid", "Not a valid ticket", "Unknown");
    addLog("Unknown", null, "err");
    return;
  }

  try {
    const res    = await fetch(WEB_APP_URL + "?action=scan&id=" + encodeURIComponent(d.ID));
    const result = await res.json();

    if (result.status === "valid") {
      showResult("valid", "✓ Valid", result.name || d.NAME);
      addLog(result.name || d.NAME, d.ID, "ok");
      loadStats();
    } else if (result.status === "duplicate") {
      showResult("duplicate", "⚠ Already scanned", result.name || d.NAME);
      document.getElementById("scanned-at-row").style.display = "flex";
      document.getElementById("res-scanned-at").textContent   = result.scannedAt || "—";
      addLog(result.name || d.NAME, d.ID, "dup");
    } else {
      showResult("invalid", "Not recognised — check connection", d.NAME || "Unknown");
      addLog(d.NAME || "Unknown", d.ID, "err");
    }
  } catch(e) {
    showResult("valid", "⚠ Offline — no duplicate check", d.NAME || "Unknown");
    addLog(d.NAME || "Unknown", d.ID, "ok");
  }
}

function showResult(type, status, name) {
  const card = document.getElementById("result-card");
  card.className = type;
  document.getElementById("res-status").textContent = status;
  document.getElementById("res-name").textContent   = name;
}

function addLog(name, id, status) {
  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  log.unshift({ name, id, status, time });
  document.getElementById("log-list").innerHTML = log.map(e => `
    <div class="log-item">
      <span>
        <span class="log-dot ${e.status}"></span>
        <strong>${e.name}</strong>
        ${e.id ? `&nbsp;<span style="color:#888780;font-size:11px;font-family:monospace">${e.id}</span>` : ""}
      </span>
      <span style="color:#888780;font-size:12px">${e.time}</span>
    </div>`).join("");
}

function reset() {
  document.getElementById("btn-scan").style.display    = "block";
  document.getElementById("reader-wrap").style.display = "none";
  document.getElementById("btn-cancel").style.display  = "none";
  document.getElementById("result-card").style.display = "none";
  document.getElementById("btn-again").style.display   = "none";
}
</script>
</body>
</html>
